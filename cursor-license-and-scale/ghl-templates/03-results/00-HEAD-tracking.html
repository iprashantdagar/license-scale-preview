<!-- Cursor License & Scale — LS Results
     Paste: Page Settings → Tracking Code → Header
     Page background: #0B0A12
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<script>window.LS_ASSET_BASE = 'https://cdn.jsdelivr.net/gh/iprashantdagar/license-scale-preview@main/assets';</script>
<script>
/* Update these AFTER you publish each GHL page */
window.LS_PAGE_URLS = {
  home: '',
  results: '',

  thankYou: ''

<style>

#ls-root .logo img,#ls-root .footer__logo img{display:block;height:28px;width:auto;max-width:min(220px,52vw)}
#ls-root .footer__logo img{height:36px;max-width:min(280px,70vw)}
#ls-root a.logo,#ls-root .footer__logo{font-size:0;letter-spacing:0;gap:0}
#ls-root .page-hero{position:relative;overflow:hidden;padding:0 8px 72px;isolation:isolate}
#ls-root .page-hero .glow{top:80px;height:220px;opacity:.35}
#ls-root .page-hero__in{max-width:760px;margin:0 auto;padding-top:24px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
#ls-root .page-hero .h1{font-size:clamp(32px,4.6vw,52px);font-weight:700;line-height:.9;letter-spacing:-.02em;color:var(--text)}
#ls-root .page-hero .lead{font-size:16px;font-weight:500;line-height:140%;color:var(--text);max-width:560px}
#ls-root .statbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
#ls-root .statbox{padding:24px 20px;border:1px solid var(--line);border-radius:12px;background:rgba(247,238,255,.02);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#ls-root .statbox b{font-size:clamp(26px,3.2vw,36px);font-weight:700;line-height:100%;letter-spacing:-.02em}
#ls-root .statbox span{font-size:13px;font-weight:400;line-height:140%;color:var(--muted)}
#ls-root .vsl-embed{width:min(910px,100%);aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#141320;position:relative}
#ls-root .vsl-embed wistia-player{position:absolute;inset:0;width:100%;height:100%}
#ls-root .benefits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:48px}
#ls-root .benefit{padding:24px;border:1px solid var(--line);border-radius:12px;background:rgba(247,238,255,.02);display:flex;flex-direction:column;gap:12px}
#ls-root .benefit h3{font-size:18px;font-weight:700;line-height:130%}
#ls-root .benefit p{font-size:14px;color:var(--muted);line-height:140%}
#ls-root .stats-row{display:flex;align-items:stretch;justify-content:center;gap:clamp(16px,3vw,40px);flex-wrap:wrap;margin-top:40px}
#ls-root .stats-row .stat{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#ls-root .stats-row .stat b{font-size:clamp(28px,3.4vw,40px);font-weight:700;line-height:90%;letter-spacing:-.02em}
#ls-root .stats-row .stat span{font-size:14px;color:var(--muted)}
#ls-root .stats-row .stat-div{width:1px;background:var(--text);opacity:.45;align-self:stretch}
#ls-root .results-stack{display:flex;flex-direction:column;gap:40px;margin-top:48px;align-items:center}
#ls-root .results-stack .result{width:100%;max-width:910px;flex:none}
#ls-root .video{position:relative;display:block;overflow:hidden;background:#141320;border:1px solid var(--line);border-radius:16px;cursor:pointer;padding:0;width:100%;color:inherit}
#ls-root .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ls-root .video.is-playing .ph,#ls-root .video.is-playing .play{opacity:0;pointer-events:none}
#ls-root .shot{cursor:zoom-in;padding:0;border:0;background:transparent;display:block;width:100%;border-radius:8px;overflow:hidden;text-align:left}
#ls-root .ls-lightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(11,10,18,.88);backdrop-filter:blur(10px)}
#ls-root .ls-lightbox.is-open{display:flex}
#ls-root .ls-lightbox__img{max-width:min(960px,100%);max-height:min(90vh,100%);border-radius:12px;object-fit:contain}
#ls-root .ls-lightbox__close{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(247,238,255,.08);color:var(--text);font-size:22px;cursor:pointer}
@media (max-width:991px){
  #ls-root .benefits{grid-template-columns:minmax(0,1fr)}
  #ls-root .page-hero{padding:0 0 48px}
  #ls-root .page-hero__in .h1{line-height:1.05}
}
@media (max-width:749px){
  #ls-root .statbar{grid-template-columns:minmax(0,1fr);gap:12px}
}
/* Results hero headline — exactly 110% leading at every breakpoint */
#ls-root .page-hero__in h1.h1{line-height:1.1}
@media (max-width:991px){
  #ls-root .page-hero__in h1.h1{line-height:1.1 !important}
  /* match the background presence of the Careers mobile hero */
  #ls-root .page-hero{
    min-height:640px;
    min-height:clamp(560px,78svh,720px);
    display:flex;
    flex-direction:column;
  }
  #ls-root .page-hero>.wrap{flex:1 1 auto;display:flex;align-items:center}
}


/* GHL hybrid shell */
html, body {
  background: #0B0A12 !important;
  margin: 0 !important;
  padding: 0 !important;
}
.hl_page-preview--content, .hl_main-content, .inner, .row-bg-wrap, .row, .c-column, .c-wrapper, .section-container {
  background: transparent !important;
}
#ls-root {
  --ls-cdn: 'https://cdn.jsdelivr.net/gh/iprashantdagar/license-scale-preview@main/assets';
}

</style>

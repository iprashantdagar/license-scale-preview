<style>


/* ═══════════════════════ TOKENS ═══════════════════════ */
#ls-root{
  --ink:#0B0A12;
  --text:#F7EEFF;
  --muted:#AAA5AD;
  --line:#1D1D23;
  --line-2:#1B1A23;
  --purple:#A610DF;
  --purple-lt:#AC58EB;
  --gold:#F7D277;
  --blue:#77BDF7;
  --green:#00B77B;
  --page:1200px;
  --gut:20px;

  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--ink);
  color:var(--text);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  /* full-bleed breakout inside GHL rows */
  position:relative;
  width:100vw;
  max-width:100vw;
  left:50%;right:50%;
  margin-left:-50vw;margin-right:-50vw;
  overflow-x:clip;
}
#ls-root *,#ls-root *::before,#ls-root *::after{margin:0;padding:0;box-sizing:border-box}
#ls-root img{display:block;max-width:100%}
#ls-root a{color:inherit;text-decoration:none}
#ls-root button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#ls-root ul,#ls-root li{list-style:none}
#ls-root :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
#ls-root .ls-fill{width:100%;height:100%;object-fit:cover}
#ls-root .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ═══════════════════════ LAYOUT ═══════════════════════ */
#ls-root .wrap{width:100%;max-width:var(--page);margin:0 auto;padding:0 var(--gut)}
#ls-root .sec{position:relative;padding:80px 8px;isolation:isolate}
#ls-root .sec--tight{padding:40px 8px}
#ls-root .glow{
  position:absolute;left:50%;transform:translateX(-50%);
  width:min(1200px,100%);height:127px;background:var(--purple);
  opacity:.3;filter:blur(120px);pointer-events:none;z-index:-1;
}
#ls-root .glow--strong{opacity:.55}
#ls-root .glow--top{top:96px}
#ls-root .glow--btm{bottom:0}

/* ═══════════════════════ TYPE ═══════════════════════ */
#ls-root .eyebrow{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:500;line-height:18px;text-transform:uppercase;letter-spacing:.01em;
}
#ls-root .eyebrow::before{content:"";width:4.72px;height:4.72px;background:var(--purple);flex:none}
#ls-root .eyebrow--c{justify-content:center}
#ls-root .h2{font-size:clamp(30px,4.4vw,48px);font-weight:700;line-height:.9;letter-spacing:-.02em}
#ls-root .head{display:flex;flex-direction:column;gap:24px}
#ls-root .head--c{align-items:center;text-align:center}

/* ═══════════════════════ BUTTONS ═══════════════════════ */
#ls-root .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  padding:14px 22px 14px 20px;border-radius:8px;border:1px solid transparent;
  font-size:18px;font-weight:700;line-height:1;
  transition:transform .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease;
}
#ls-root .btn svg{flex:none;transition:transform .18s ease}
#ls-root .btn:hover{transform:translateY(-2px)}
#ls-root .btn:hover svg{transform:translate(2px,-2px)}
#ls-root .btn:active{transform:translateY(0)}
#ls-root .btn--light{background:var(--text);color:var(--ink)}
#ls-root .btn--light:hover{box-shadow:0 12px 30px -10px rgba(247,238,255,.45)}
#ls-root .btn--ghost{background:rgba(247,238,255,.07)}
#ls-root .btn--ghost:hover{background:rgba(247,238,255,.15)}
#ls-root .btn--outline{border-color:var(--line)}
#ls-root .btn--outline:hover{border-color:var(--purple-lt);background:rgba(172,88,235,.08)}
#ls-root .btn--sm{font-size:16px;height:44px}
#ls-root .btn--wide{width:100%}

/* ═══════════════════════ PLACEHOLDERS ═══════════════════════ */
#ls-root .ph{
  position:relative;width:100%;height:100%;border-radius:inherit;overflow:hidden;
  background-color:#141320;background-size:cover;background-position:center;
  background-image:
    linear-gradient(135deg,rgba(166,16,223,.18),rgba(166,16,223,0) 55%),
    repeating-linear-gradient(45deg,rgba(247,238,255,.035) 0 10px,transparent 10px 20px);
  border:1px dashed rgba(247,238,255,.14);
  display:flex;align-items:center;justify-content:center;
}
#ls-root .ph::after{
  content:attr(data-ph);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(247,238,255,.4);padding:6px 8px;text-align:center;
}
#ls-root .ph.is-set{border-style:solid;border-color:var(--line);background-image:var(--img)}
#ls-root .ph.is-set::after{content:""}

/* ═══════════════════════ TRUSTPILOT ═══════════════════════ */
#ls-root .trust{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#ls-root .trust b,#ls-root .trust span.v{font-size:14px;font-weight:700;letter-spacing:-.03em;line-height:120%}
#ls-root .trust .tp{display:flex;align-items:center;gap:5px}
#ls-root .stars{display:flex;align-items:center;gap:1.54px}
#ls-root .stars i{width:15.8px;height:16px;background:var(--green);display:flex;align-items:center;justify-content:center}
#ls-root .trust .dot{width:4px;height:4px;background:var(--text);flex:none}
#ls-root .trust--bar{
  width:100%;max-width:910px;justify-content:center;gap:24px;padding:24px;
  background:rgba(172,88,235,.1);border-radius:8px;
}
#ls-root .trust--bar b,#ls-root .trust--bar span.v{font-size:clamp(15px,2vw,20.6px)}
#ls-root .trust--bar .stars i{width:23.24px;height:23.53px}
#ls-root .trust--bar .stars{gap:2.27px}
#ls-root .trust--bar .tp{gap:7.4px}
#ls-root .trust--bar .dot{width:5.88px;height:5.88px}

/* ═══════════════════════ NAV ═══════════════════════ */
#ls-root .nav{position:relative;z-index:30;padding:24px 100px}
#ls-root .nav__in{max-width:var(--page);margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;gap:24px}
#ls-root .logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#ls-root .logo__mark{width:15px;height:21px;background:var(--text);clip-path:polygon(50% 0,100% 36%,76% 100%,24% 100%,0 36%);flex:none}
#ls-root .logo img,#ls-root .footer__logo img{display:block;height:28px;width:auto;max-width:min(220px,52vw)}
#ls-root .footer__logo img{height:36px;max-width:min(280px,70vw)}
#ls-root a.logo{font-size:0;letter-spacing:0;gap:0}
#ls-root .footer__logo{font-size:0;letter-spacing:0;gap:0}
#ls-root .menu{display:flex;align-items:center;gap:32px}
#ls-root .menu a{font-size:14px;font-weight:700;line-height:21px;text-transform:uppercase;transition:color .18s ease,opacity .18s ease}
#ls-root .menu a:first-child{font-size:16px;line-height:24px}
#ls-root .menu a:hover{color:var(--gold)}
#ls-root .burger{display:none;width:44px;height:44px;border-radius:8px;background:rgba(247,238,255,.07);align-items:center;justify-content:center}
#ls-root .burger i{position:relative;display:block;width:18px;height:2px;background:var(--text)}
#ls-root .burger i::before,#ls-root .burger i::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--text)}
#ls-root .burger i::before{top:-6px}
#ls-root .burger i::after{top:6px}

/* ═══════════════════════ HERO ═══════════════════════ */
#ls-root .hero{position:relative;overflow:hidden}
#ls-root .hero__bg{
  position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;
  background-color:#171326;background-image:var(--img,none);
}
#ls-root .hero__veil{
  position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,10,18,.35) 0%,rgba(11,10,18,0) 59.25%,#0B0A12 100%);
}
#ls-root .hero__body{padding:64px 0}
#ls-root .hero__grid{display:flex;align-items:center;justify-content:space-between;gap:48px}
#ls-root .hero__col{width:576px;max-width:100%;display:flex;flex-direction:column;gap:32px}
#ls-root .hero__copy{display:flex;flex-direction:column;align-items:flex-start;gap:24px;position:relative}
#ls-root .hero__h1{
  position:relative;font-size:clamp(34px,3.9vw,56px);font-style:italic;font-weight:700;
  line-height:.9;letter-spacing:-.02em;color:var(--gold);
}
#ls-root .mark{position:relative;display:inline-block;padding:0 10px;z-index:1}
#ls-root .mark::before{
  content:"";position:absolute;left:0;right:0;top:.02em;bottom:.06em;
  background:var(--purple);z-index:-1;
}
#ls-root .rocket{display:inline-block;width:.78em;height:.78em;vertical-align:-.1em;margin-left:-.06em;position:relative;z-index:2}
#ls-root .rocket svg{width:100%;height:100%}
#ls-root .hero__sub{max-width:423px;font-size:16px;font-weight:500;line-height:140%}
#ls-root .stats{display:flex;align-items:stretch;gap:clamp(16px,2vw,28px);flex-wrap:wrap}
#ls-root .stat{display:flex;flex-direction:column;gap:12px;min-width:0}
#ls-root .stat b{font-size:clamp(28px,3.1vw,40px);font-weight:700;line-height:90%;letter-spacing:-.02em}
#ls-root .stat span{font-size:14px;font-weight:400;line-height:140%;white-space:nowrap}
#ls-root .stat-div{width:1px;background:var(--text);opacity:.55;align-self:stretch}

/* VSL card */
#ls-root .vsl{
  width:535px;max-width:100%;flex:none;position:relative;overflow:hidden;
  border:2px solid var(--text);border-radius:12px;background:#0f0e18;
  box-shadow:0 0 52px rgba(255,255,255,.25);
}
#ls-root .vsl__bar{height:40px;background:var(--purple-lt);display:flex;align-items:center;justify-content:center;gap:11px;padding:0 12px}
#ls-root .vsl__bar b{font-size:clamp(13px,1.4vw,16px);font-weight:700;line-height:140%}
#ls-root .vsl__frame{position:relative;aspect-ratio:535/279;background:#141320}
#ls-root .vsl__frame iframe,#ls-root .vsl__frame video{position:absolute;inset:0;width:100%;height:100%;border:0}
#ls-root .vsl__strip{display:none}
#ls-root .play{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:77px;height:43px;border-radius:4px;background:var(--purple-lt);
  display:flex;align-items:center;justify-content:center;z-index:3;
  transition:background-color .2s ease;
}
#ls-root .play--round{width:40px;height:40px;border-radius:1000px}
#ls-root .video:hover .play,#ls-root .vsl:hover .play{background:var(--purple)}

/* ═══════════════════════ CASE STUDIES ═══════════════════════ */
#ls-root .cases{display:flex;flex-direction:column;align-items:center;gap:40px;margin-top:48px}
#ls-root .video{
  position:relative;display:block;overflow:hidden;background:#141320;
  border:1px solid var(--line);border-radius:16px;cursor:pointer;padding:0;width:100%;color:inherit;
}
#ls-root .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ls-root .video.is-playing .ph,#ls-root .video.is-playing .play{opacity:0;pointer-events:none}
#ls-root .case{
  width:100%;max-width:910px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:48px;align-items:center;
}
#ls-root .case .video{aspect-ratio:431/266}
#ls-root .case__copy{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
#ls-root .case__title-btn{display:block;width:100%;text-align:left}
#ls-root .case__title a{color:inherit;text-decoration:none}
#ls-root .case__title a:hover{color:var(--gold)}
#ls-root .tag{
  display:inline-flex;align-items:center;height:19px;padding:0 4px;background:var(--purple);
  font-size:16px;font-weight:700;line-height:120%;letter-spacing:-.03em;
}
#ls-root .case__title{font-size:clamp(20px,2.3vw,28px);font-weight:700;line-height:120%;letter-spacing:-.03em}
#ls-root .grid2{width:100%;max-width:910px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
#ls-root .grid2 .video{aspect-ratio:443/266}

/* ═══════════════════════ TESTIMONIAL + PROCESS ═══════════════════════ */
#ls-root .quote{
  display:grid;grid-template-columns:243px minmax(0,606px);gap:48px;
  justify-content:space-between;padding:48px 64px;
}
#ls-root .quote__who{display:flex;flex-direction:column;justify-content:space-between;gap:12px}
#ls-root .avatar{width:81px;height:81px;border-radius:5.06px;overflow:hidden;border:1.27px solid var(--line);flex:none}
#ls-root .who__name{font-size:12px;font-weight:500;line-height:18px;text-transform:uppercase;margin-top:16px}
#ls-root .who__role{font-size:12px;font-weight:500;line-height:18px;text-transform:uppercase;color:var(--muted)}
#ls-root .press{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
#ls-root .quote__body{display:flex;flex-direction:column;justify-content:space-between;gap:24px}
#ls-root .quote__text{font-size:clamp(18px,2vw,24px);font-weight:700;line-height:140%;letter-spacing:-.05em}
#ls-root .steps-wrap{display:flex;flex-direction:column;gap:48px;margin-top:64px}
#ls-root .steps-title{font-size:clamp(24px,2.6vw,32px);font-weight:700;line-height:90%;letter-spacing:-.02em;text-align:center}
#ls-root .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
#ls-root .step{display:flex;flex-direction:column;gap:16px;padding:0 clamp(0px,1.6vw,24px)}
#ls-root .step+.step{border-left:1px solid var(--line)}
#ls-root .step__hd{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;line-height:27px}
#ls-root .step p{font-size:14px;font-weight:400;line-height:140%;color:var(--muted)}

/* ═══════════════════════ PRESS MARQUEE ═══════════════════════ */
#ls-root .press-hd{font-size:16px;font-weight:600;line-height:140%;text-align:center}
#ls-root .marquee{position:relative;margin-top:48px;overflow:hidden;height:31px}
#ls-root .marquee::before,#ls-root .marquee::after{
  content:"";position:absolute;top:0;width:86px;height:100%;z-index:2;pointer-events:none;
}
#ls-root .marquee::before{left:0;background:linear-gradient(90deg,#0B0A12,rgba(11,10,18,0))}
#ls-root .marquee::after{right:0;background:linear-gradient(270deg,#0B0A12,rgba(11,10,18,0))}
#ls-root .marquee__track{display:flex;align-items:center;gap:88px;width:max-content;animation:ls-slide 34s linear infinite}
#ls-root .marquee:hover .marquee__track{animation-play-state:paused}
#ls-root .marquee__track span{
  font-size:26px;font-weight:700;line-height:1;letter-spacing:.02em;white-space:nowrap;color:#fff;opacity:.95;
}
@keyframes ls-slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ═══════════════════════ RESULTS CAROUSEL ═══════════════════════ */
#ls-root .rail{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:2px}
#ls-root .rail::-webkit-scrollbar{display:none}
#ls-root .result{
  flex:0 0 500px;max-width:88vw;scroll-snap-align:start;position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:16px;padding:24px;
  display:flex;flex-direction:column;gap:24px;
}
#ls-root .result::before{
  content:"";position:absolute;width:726px;height:726px;right:-327px;top:-377px;
  background:var(--purple);opacity:.3;filter:blur(120px);pointer-events:none;z-index:-1;
}
#ls-root .result__hd{display:flex;flex-direction:column;gap:16px}
#ls-root .result__label{font-size:14px;font-weight:500;line-height:21px;text-transform:uppercase;color:var(--muted)}
#ls-root .result__big{font-size:clamp(22px,2.4vw,28px);font-weight:700;line-height:140%;letter-spacing:-.05em;color:var(--gold)}
#ls-root .result__quote{font-size:18px;font-weight:700;line-height:140%;letter-spacing:-.05em}
#ls-root .result .video{aspect-ratio:452/266;border-radius:12px;display:flex;align-items:center;justify-content:center}
#ls-root .result .play{position:static;translate:none}
#ls-root .byline{display:flex;align-items:center;gap:16px}
#ls-root .byline__img{width:24px;height:24px;border-radius:4px;overflow:hidden;border:.375px solid var(--line);flex:none}
#ls-root .byline p{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;font-weight:500;line-height:18px;text-transform:uppercase}
#ls-root .byline p i{width:2px;height:2px;background:var(--muted);flex:none}
#ls-root .byline em{font-style:normal;color:var(--muted)}
#ls-root .railnav{display:flex;align-items:center;justify-content:space-between;gap:40px;margin-top:32px;height:32px}
#ls-root .dots{display:flex;align-items:center;gap:4px}
#ls-root .dots button{width:6px;height:6px;border-radius:1000px;background:var(--line-2);transition:all .2s ease}
#ls-root .dots button[aria-current="true"]{width:8px;height:8px;background:var(--gold)}
#ls-root .arrows{display:flex;align-items:center;gap:16px}
#ls-root .arrows button{
  width:32px;height:32px;border-radius:1000px;border:1.33px solid var(--line);
  display:flex;align-items:center;justify-content:center;transition:background-color .2s,border-color .2s;
}
#ls-root .arrows button.is-on{background:var(--line-2);border-color:var(--line-2)}
#ls-root .arrows button:hover{border-color:var(--purple-lt)}

/* ═══════════════════════ COMMUNITY MASONRY ═══════════════════════ */
#ls-root .masonry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;margin-top:48px}
#ls-root .mcol{display:flex;flex-direction:column;gap:16px}
#ls-root .shot{width:100%;border-radius:8px;overflow:hidden;cursor:zoom-in;padding:0;border:0;background:transparent;display:block;text-align:left}
#ls-root .shot:focus-visible{outline:2px solid var(--purple-lt);outline-offset:3px}
#ls-root .ls-lightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(11,10,18,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#ls-root .ls-lightbox.is-open{display:flex}
#ls-root .ls-lightbox__img{max-width:min(960px,100%);max-height:min(90vh,100%);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.55);object-fit:contain;background:#0f0e18}
#ls-root .ls-lightbox__close{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(247,238,255,.08);color:var(--text);font-size:22px;line-height:1;cursor:pointer}

/* ═══════════════════════ PLAYBOOKS ═══════════════════════ */
#ls-root .cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:48px}
#ls-root .card{display:flex;flex-direction:column;gap:24px}
#ls-root .card__media{aspect-ratio:384/210;border:1px solid var(--line);border-radius:16px;overflow:hidden}
#ls-root .card__body{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
#ls-root .card__title{font-size:20px;font-weight:700;line-height:120%;letter-spacing:-.03em}
#ls-root .card__text{font-size:14px;font-weight:400;line-height:140%;color:var(--muted)}

/* ═══════════════════════ CAREERS ═══════════════════════ */
#ls-root .jobs{display:flex;flex-direction:column;align-items:center;gap:24px;margin-top:48px}
#ls-root .job{
  width:100%;max-width:588px;padding:24px;border-radius:8px;
  background:rgba(247,238,255,.02);border:1px dashed var(--line);
  display:flex;flex-direction:column;gap:16px;
  transition:border-color .2s,background-color .2s,transform .2s;
}
#ls-root .job:hover{border-color:var(--purple-lt);background:rgba(172,88,235,.05);transform:translateY(-2px)}
#ls-root .job__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ls-root .job__title{font-size:18px;font-weight:700;line-height:27px}
#ls-root .pill{
  display:inline-flex;align-items:center;gap:8px;height:30px;padding:8px;
  border:1px solid var(--line);border-radius:4px;
  font-size:12px;font-weight:600;line-height:120%;white-space:nowrap;
}
#ls-root .pill i{width:4px;height:4px;flex:none}
#ls-root .job p{font-size:14px;font-weight:400;line-height:140%;color:var(--muted)}
#ls-root .meta{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;line-height:140%}
#ls-root .meta span{display:inline-flex;align-items:center;gap:8px}
#ls-root .meta em{width:3px;height:3px;background:var(--muted);border-radius:1000px;display:block}

/* ═══════════════════════ FAQ ═══════════════════════ */
#ls-root .faq{display:grid;grid-template-columns:216px minmax(0,659px);gap:48px;justify-content:space-between}
#ls-root .faq__title{font-size:clamp(30px,3.4vw,40px);font-weight:700;line-height:90%;letter-spacing:-.02em;margin-top:24px}
#ls-root .faq .eyebrow{color:var(--muted)}
#ls-root .acc{display:flex;flex-direction:column}
#ls-root .acc__item{border:1px solid var(--line);margin-bottom:-1px}
#ls-root .acc__item:first-child{border-radius:8px 8px 0 0}
#ls-root .acc__item:last-child{border-radius:0 0 8px 8px;margin-bottom:0}
#ls-root .acc__btn{
  width:100%;min-height:51px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:16px 24px;text-align:left;
  font-size:16px;font-weight:500;line-height:120%;letter-spacing:-.03em;color:var(--muted);
  transition:color .2s ease;
}
#ls-root .acc__btn:hover{color:var(--text)}
#ls-root .acc__item.is-open .acc__btn{color:var(--text);font-weight:700}
#ls-root .acc__btn svg{flex:none;transition:transform .25s ease}
#ls-root .acc__item.is-open .acc__btn svg{transform:rotate(180deg)}
#ls-root .acc__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
#ls-root .acc__item.is-open .acc__panel{grid-template-rows:1fr}
#ls-root .acc__inner{overflow:hidden}
#ls-root .acc__inner>div{display:flex;gap:16px;padding:0 24px 16px}
#ls-root .acc__inner i{width:4.72px;height:4.72px;background:var(--purple);flex:none;margin-top:8px}
#ls-root .acc__inner p{font-size:14px;font-weight:400;line-height:140%}

/* ═══════════════════════ SURVEY ═══════════════════════ */
#ls-root .survey-sec{padding:8px}
#ls-root .survey-box{
  max-width:var(--page);margin:0 auto;padding:48px var(--gut);border-radius:16px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:40px;isolation:isolate;
}
#ls-root .survey-hd{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
#ls-root .survey-hd h2{font-size:clamp(26px,3.3vw,40px);font-weight:700;line-height:90%;letter-spacing:-.02em}
#ls-root .survey{
  width:100%;max-width:860px;padding:24px;border-radius:12px;background:rgba(247,238,255,.02);
  display:flex;flex-direction:column;gap:24px;
}
#ls-root .survey-embed{
  width:100%;max-width:860px;padding:8px;border-radius:12px;background:rgba(247,238,255,.02);
  border:1px solid var(--line);overflow:hidden;min-height:520px;
}
#ls-root .survey-embed [data-tf-live],
#ls-root .survey-embed [data-tf-live] > div,
#ls-root .survey-embed iframe{width:100%!important;min-height:520px!important;height:520px!important;border:0}
#ls-root .survey__q{display:flex;align-items:center;gap:16px}
#ls-root .num{
  width:20px;height:20px;border-radius:5px;background:var(--text);color:var(--ink);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11.67px;font-weight:700;
}
#ls-root .survey__q b{font-size:16px;font-weight:700;line-height:120%;letter-spacing:-.03em}
#ls-root .survey__row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
#ls-root .opts{display:flex;flex-direction:column;gap:8px;width:338px;max-width:100%}
#ls-root .opt{
  display:flex;align-items:center;gap:12px;height:45px;padding:12px 24px 12px 16px;
  background:rgba(247,238,255,.08);border-radius:8px;text-align:left;
  font-size:14px;font-weight:700;line-height:21px;white-space:nowrap;transition:background-color .2s ease;
}
#ls-root .opt:hover{background:rgba(247,238,255,.15)}
#ls-root .opt__key{
  width:20px;height:20px;border:.83px solid var(--text);border-radius:5px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11.67px;font-weight:500;transition:all .2s ease;
}
#ls-root .opt.is-on{background:rgba(172,88,235,.3)}
#ls-root .opt.is-on .opt__key{background:var(--text);color:var(--ink)}
#ls-root .survey .btn{height:42px;padding:12px 18px 12px 16px}
#ls-root .survey-err{font-size:12px;color:var(--gold);display:none}
#ls-root .survey.has-err .survey-err{display:block}

/* ═══════════════════════ FOOTER ═══════════════════════ */
#ls-root .footer{padding:48px 8px}
#ls-root .footer__in{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#ls-root .footer__logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
#ls-root .footer__logo .logo__mark{width:20px;height:28px}
#ls-root .footer small{font-size:12px;font-weight:400;line-height:140%}
#ls-root .footer small a:hover{color:var(--gold)}

/* ═══════════════════════ DOODLE ARROWS ═══════════════════════ */
#ls-root .doodle{position:absolute;width:78px;height:38px;z-index:1;pointer-events:none}
#ls-root .doodle svg{width:100%;height:100%;overflow:visible}
#ls-root .doodle--l{left:calc(50% - 648px);top:250px;transform:rotate(6deg)}
#ls-root .doodle--r{right:calc(50% - 648px);top:250px;transform:scaleX(-1) rotate(6deg)}
#ls-root .doodle--side{right:calc(50% - 655px);top:96px;transform:rotate(150deg) scaleY(-1)}
@media (max-width:1400px){#ls-root .doodle{display:none}}

/* ═══════════════════════ REVEAL ═══════════════════════ */
#ls-root .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
#ls-root .rv.is-in{opacity:1;transform:none}
